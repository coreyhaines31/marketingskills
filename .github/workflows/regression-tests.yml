name: Regression Tests

on:
  push:
    branches: [main]
    paths:
      - "validate-skills.sh"
      - "tests/**"
      - "tools/clis/**"
      - "skills/ad-creative/assets/creative-review-template.html"
      - ".github/workflows/regression-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "validate-skills.sh"
      - "tests/**"
      - "tools/clis/**"
      - "skills/ad-creative/assets/creative-review-template.html"
      - ".github/workflows/regression-tests.yml"

concurrency:
  group: regression-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-skills-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run validate-skills.sh regression tests
        run: bash tests/run-regression.sh

  cli-contract-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check CLI syntax
        run: for f in tools/clis/*.js; do node --check "$f"; done

      - name: Run CLI and asset contract tests
        run: node --test tests/clis/*.test.cjs tests/assets/*.test.cjs
